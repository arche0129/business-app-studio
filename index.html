<body>
<div id="app"></div>
<script id="boot-data" type="application/json">{"mode":"builder"}</script>
<script>
(()=>{'use strict';
const boot=JSON.parse(document.getElementById('boot-data').textContent||'{}');
const isPlayer=boot.mode==='player';
const root=document.getElementById('app');
root.dataset.mode=isPlayer?'player':'builder';
const KEY_BUILDER='businessAppStudio.builder.v1'; // Keep the prior storage key for backwards compatibility
const KEY_PLAYER='businessAppStudio.player.'+String(boot.exportId||'unknown');
let tick=0;
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+(++tick).toString(36)+'_'+Math.random().toString(36).slice(2,6)}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function attr(v){return esc(v)}
function clone(v){return JSON.parse(JSON.stringify(v))}
function findPage(id){return state.project.pages.find(p=>p.id===id)}
function findTable(id){return state.project.tables.find(t=>t.id===id)}
function findComponent(id){for(const p of state.project.pages){const c=p.components.find(c=>c.id===id);if(c)return c}return null}
function activePage(){return findPage(state.pageId)||state.project.pages[0]}
function saveLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}
function loadLocal(key){try{const s=localStorage.getItem(key);return s?JSON.parse(s):null}catch(e){return null}}
function startProject(){return {version:1,id:uid('project'),name:'新しいアプリ',accent:'#4169e8',pages:[{id:uid('page'),name:'画面1',components:[]}],tables:[],relations:[],flows:[],queries:[]};}
function validProject(p){return p&&typeof p==='object'&&typeof p.name==='string'&&Array.isArray(p.pages)&&p.pages.length>0&&p.pages.every(pg=>pg&&Array.isArray(pg.components))&&Array.isArray(p.tables)&&p.tables.every(t=>t&&Array.isArray(t.columns)&&Array.isArray(t.rows));}
let saved=loadLocal(isPlayer?KEY_PLAYER:KEY_BUILDER);
let initial=isPlayer?(validProject(saved)?saved:boot.project):(validProject(saved)?saved:startProject());
if(!validProject(initial)){initial=startProject()}
function normalizeProject(p){p.relations=Array.isArray(p.relations)?p.relations:[];p.flows=Array.isArray(p.flows)?p.flows:[];for(const pg of p.pages){pg.layoutMode=pg.layoutMode==='free'?'free':'grid';pg.canvasWidth=Number(pg.canvasWidth)||960;pg.canvasHeight=Number(pg.canvasHeight)||650;for(let i=0;i<pg.components.length;i++){const c=pg.components[i];if(!Number.isFinite(Number(c.x)))c.x=i%2?490:30;if(!Number.isFinite(Number(c.y)))c.y=25+Math.floor(i/2)*84;if(!Number.isFinite(Number(c.w)))c.w=c.width==='half'?430:880;if(!Number.isFinite(Number(c.h)))c.h= c.type==='table'?210:c.type==='heading'?65:c.type==='textarea'?110:76;}}return p}
const state={project:normalizeProject(clone(initial)),tab:'design',pageId:initial.pages[0].id,selectedId:null,tableId:initial.tables[0]?.id||'',flowId:'',selectedNodeId:'',selectedRelationId:'',queryId:'',queryStepId:'',connecting:null,forms:{},filters:{},selectedRow:{},toastTimer:0};
state.flowId=state.project.flows[0]?.id||'';state.selectedRelationId=state.project.relations[0]?.id||'';

let saveWarningShown=false;function persist(){const ok=saveLocal(isPlayer?KEY_PLAYER:KEY_BUILDER,state.project);if(!ok&&!saveWarningShown){saveWarningShown=true;message('保存容量を超えました。必ずJSON保存でバックアップしてください。',true)}return ok}
function message(text,bad=false){let div=document.getElementById('bas-toast');if(!div){div=document.createElement('div');div.id='bas-toast';document.body.append(div)}div.className='toast'+(bad?' error':'');div.textContent=text;div.style.display='block';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>div.style.display='none',3200)}
function colorScheme(){const c=/^#[0-9a-f]{6}$/i.test(state.project.accent)?state.project.accent:'#4169e8';document.documentElement.style.setProperty('--blue',c)}
function download(name,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function csvCell(v){const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function csvText(t){const rows=[t.columns.map(c=>c.label).map(csvCell).join(',')];for(const r of t.rows){rows.push(t.columns.map(c=>csvCell(r[c.key])).join(','))}return '\ufeff'+rows.join('\r\n')}
function parseCSV(str,delimiter=','){const rows=[];let line=[],cur='',quote=false;str=str.replace(/^\ufeff/,'');for(let i=0;i<str.length;i++){const ch=str[i];if(quote){if(ch==='"'&&str[i+1]==='"'){cur+='"';i++}else if(ch==='"')quote=false;else cur+=ch}else if(ch==='"'){quote=true}else if(ch===delimiter){line.push(cur);cur=''}else if(ch==='\r'||ch==='\n'){if(ch==='\r'&&str[i+1]==='\n')i++;line.push(cur);if(line.some(x=>x!==''))rows.push(line);cur='';line=[]}else cur+=ch}line.push(cur);if(line.some(x=>x!==''))rows.push(line);return rows}
function selectOptions(values,selected){return values.map(([v,text])=>`<option value="${attr(v)}" ${String(v)===String(selected)?'selected':''}>${esc(text)}</option>`).join('')}
function compLabel(type){return ({heading:'見出し',text:'説明テキスト',input:'入力欄',number:'数値入力',textarea:'複数行入力',select:'選択欄',checkbox:'チェックボックス',button:'ボタン',table:'データテーブル',stat:'集計カード',lookup:'参照ラベル',chart:'棒グラフ',divider:'区切り線'})[type]||type}
function typeIcon(type){return ({heading:'T',text:'≡',input:'▤',number:'#',textarea:'☷',select:'⌄',checkbox:'☑',button:'▣',table:'▦',stat:'◫',lookup:'↗',chart:'▥',divider:'―'})[type]||'□'}
function newComponent(type){const common={id:uid('comp'),type,label:compLabel(type),width: ['heading','text','table','chart','divider','textarea'].includes(type)?'full':'half',x:40,y:40,w:300,h:type==='table'?200:85};if(['input','number','textarea','select','checkbox','date','time','datetime','email','tel','url','radio','range','toggle','searchselect','cascade','multiselect','daterange','photo','camera','barcode','pen','microphone','richtext','rating','address','mr'].includes(type)){return {...common,placeholder:'',tableId:state.project.tables[0]?.id||'',fieldKey:'',options:'選択肢1\n選択肢2',required:false}}if(type==='button'){return {...common,label:'ボタン',action:'toast',message:'ボタンが押されました',tableId:state.project.tables[0]?.id||'',targetPageId:state.project.pages[0]?.id||'',sourceId:'',flowId:state.project.flows[0]?.id||'',variant:'primary'}}if(type==='table'){return {...common,tableId:state.project.tables[0]?.id||'',relationId:''}}if(type==='chart'){return {...common,label:'カテゴリ別グラフ',tableId:state.project.tables[0]?.id||'',chartGroupKey:'',chartMetricKey:'',chartOp:'count',w:520,h:250}}if(type==='lookup'){return {...common,label:'参照情報',relationId:state.project.relations[0]?.id||'',sourceId:'',displayField:'',w:260,h:80}}if(type==='stat'){return {...common,tableId:state.project.tables[0]?.id||'',aggregate:'count',fieldKey:''}}if(type==='heading')common.label='新しい見出し';if(type==='text')common.label='ここに説明文を入力してください。';if(type==='divider')common.label='';return common}
function fieldMarkup(title,key,value,extra=''){return `<div class="field"><label>${esc(title)}</label><input class="form-control" data-prop="${attr(key)}" value="${attr(value??'')}" ${extra}></div>`}
function propSelect(title,key,opts,value){return `<div class="field"><label>${esc(title)}</label><select class="form-control" data-prop="${attr(key)}">${selectOptions(opts,value)}</select></div>`}
function tableOptions(){return [['','（未選択）'],...state.project.tables.map(t=>[t.id,t.name])]}
function pageOptions(){return state.project.pages.map(p=>[p.id,p.name])}
function relationOptions(){return [['','（結合しない）'],...state.project.relations.map(r=>[r.id,r.name])]}
function flowOptions(){return [['','（未設定）'],...state.project.flows.map(f=>[f.id,f.name])]}
function inputOptions(){return [['','（未選択）'],...state.project.pages.flatMap(p=>p.components.filter(c=>['input','number','textarea','select','checkbox','date','time','datetime','email','tel','url','radio','range','toggle','searchselect','cascade','multiselect','daterange','photo','camera','barcode','pen','microphone','richtext','rating','address','mr'].includes(c.type)).map(c=>[c.id,p.name+' / '+c.label]))]}
function relation(id){return state.project.relations.find(r=>r.id===id)}
function fieldOptions(tableId){const t=findTable(tableId);return [['','（連携なし）'],...(t?.columns||[]).map(c=>[c.key,c.label+' ('+c.key+')'])]}
function renderInspector(){const c=findComponent(state.selectedId);if(!c)return `<div class="side-heading">プロパティ</div><div class="empty"><div class="big">▤</div>キャンバスの部品を選択すると、<br>ここで設定できます。</div><div class="notice">💡 左のパレットから部品をクリック、またはドラッグして追加します。</div>`;
let out=`<div class="side-heading">プロパティ <span class="badge">${esc(compLabel(c.type))}</span></div><div class="inspector-section"><h3 class="inspector-title">${esc(compLabel(c.type))}</h3><p class="helper">部品ID: <span class="key-shortcut">${esc(c.id)}</span></p></div>`;
if(c.type!=='divider')out+=fieldMarkup(c.type==='text'?'本文':c.type==='heading'?'見出し':c.type==='button'?'ボタンの文字':'表示ラベル','label',c.label);
out+=propSelect(activePage()?.layoutMode==='free'?'グリッド配置時の横幅':'グリッド配置の横幅','width',V13_WIDTHS,c.width||'full');if(activePage()?.layoutMode!=='free')out+='<p class="helper">1行を12分割した幅です。25%を4個、33.3%を3個、50%を2個並べられます。入り切らない部品は次の行に送られます。</p>';
if(['input','number','textarea'].includes(c.type))out+=fieldMarkup('プレースホルダー','placeholder',c.placeholder);
if(c.type==='select'){
 out+=propSelect('選択肢の取得方法','optionsMode',[['manual','手動で設定'],['table','別テーブルを参照']],c.optionsMode||'manual');
 if(c.optionsMode==='table'){out+=propSelect('参照するテーブル','optionsTableId',tableOptions(),c.optionsTableId);out+=propSelect('保存する値の列','optionValueKey',fieldOptions(c.optionsTableId),c.optionValueKey);out+=propSelect('表示名の列','optionLabelKey',fieldOptions(c.optionsTableId),c.optionLabelKey)}
 else out+=`<div class="field"><label>選択肢（1行につき1つ）</label><textarea class="form-control" data-prop="options">${esc(c.options||'')}</textarea></div>`;
}
if(['input','number','textarea','select','checkbox','date','time','datetime','email','tel','url','radio','range','toggle','searchselect','cascade','multiselect','daterange','photo','camera','barcode','pen','microphone','richtext','rating','address','mr','table','stat','chart'].includes(c.type)||c.type==='button'&&['add','update','delete','clear','search','reset-search','csv','file-import'].includes(c.action)){
 out+=propSelect('データテーブル','tableId',tableOptions(),c.tableId);
}
if(['input','number','textarea','select','checkbox','date','time','datetime','email','tel','url','radio','range','toggle','searchselect','cascade','multiselect','daterange','photo','camera','barcode','pen','microphone','richtext','rating','address','mr'].includes(c.type)){
 out+=propSelect('連携する列','fieldKey',fieldOptions(c.tableId),c.fieldKey);
 out+=`<label class="app-checkbox" style="margin-bottom:12px"><input type="checkbox" data-prop="required" ${c.required?'checked':''}>必須入力</label>`;
 out+=`<div class="notice">登録・更新ボタンと同じテーブルを指定すると、値が自動で保存されます。</div>`;
}
if(c.type==='button'){
 out+=propSelect('クリック時の処理','action',[['query-refresh','クエリを更新'],['upsert','キー照合で追加・更新'],['set-variable','共通変数を設定'],['flow','視覚フローを実行'],['publish-analysis','分析結果を更新'],['toast','メッセージを表示'],['add','新規登録'],['update','選択行を更新'],['delete','選択行を削除'],['clear','入力欄をクリア'],['search','テーブルを検索'],['reset-search','検索条件をリセット'],['file-import','CSV / XLSXから登録'],['csv','CSVをダウンロード'],['navigate','別ページへ移動']],c.action);
 if(c.action==='flow')out+=propSelect('実行する処理フロー','flowId',flowOptions(),c.flowId);
 if(['add','update','delete','clear','search','reset-search','csv','file-import'].includes(c.action))out+=propSelect('対象テーブル','tableId',tableOptions(),c.tableId);
 if(c.action==='search'){
 let all=state.project.pages.flatMap(p=>p.components).filter(k=>['input','number','textarea'].includes(k.type));
 out+=propSelect('検索文字の入力欄','sourceId',[['','（未選択）'],...all.map(a=>[a.id,a.label])],c.sourceId);
 }
 if(c.action==='navigate')out+=propSelect('移動先ページ','targetPageId',pageOptions(),c.targetPageId);
 if(c.action==='toast')out+=fieldMarkup('メッセージ','message',c.message||'操作しました');
 out+=propSelect('ボタンの色','variant',[['primary','メイン'],['secondary','淡い青'],['danger','赤']],c.variant||'primary');
}
if(c.type==='table')out+=propSelect('結合する参照定義','relationId',relationOptions(),c.relationId||'');
if(c.type==='lookup'){out+=propSelect('参照定義','relationId',relationOptions(),c.relationId);out+=propSelect('参照キーを入力する部品','sourceId',inputOptions(),c.sourceId);const r=relation(c.relationId),t=findTable(r?.toTableId);out+=propSelect('表示する参照先の列','displayField',fieldOptions(t?.id),c.displayField);}
if(c.type==='chart'){out+=propSelect('グループ列','chartGroupKey',fieldOptions(c.tableId),c.chartGroupKey||'');out+=propSelect('集計方法','chartOp',[['count','件数'],['sum','合計'],['avg','平均'],['min','最小'],['max','最大']],c.chartOp||'count');if(c.chartOp!=='count')out+=propSelect('集計する列','chartMetricKey',fieldOptions(c.tableId),c.chartMetricKey||'')}
if(c.type==='stat'){
 out+=propSelect('集計方法','aggregate',[['count','行数を数える'],['sum','合計'],['avg','平均'],['min','最小'],['max','最大']],c.aggregate);
 if(c.aggregate!=='count')out+=propSelect('集計する列','fieldKey',fieldOptions(c.tableId),c.fieldKey);
}
if(activePage()?.layoutMode==='free')out+=`<div class="inspector-section"><div class="side-heading">自由配置（px）</div><div class="field-row">${['x','y','w','h'].map(k=>`<div class="field"><label>${k.toUpperCase()}</label><input type="number" class="form-control" data-prop="${k}" min="0" value="${Number(c[k]||0)}"></div>`).join('')}</div><p class="helper">8px刻みで移動・サイズ変更。右下の青い□で大きさ変更。</p></div>`;
out+=`<div class="inspector-section" style="margin-top:19px"><div class="side-heading">配置</div><div class="button-row"><button class="btn small" data-action="move-up">↑ 前へ</button><button class="btn small" data-action="move-down">↓ 後ろへ</button><button class="btn small" data-action="component-duplicate">複製</button><button class="btn small danger" data-action="component-delete">削除</button></div></div>`;
return out;
}
function formatValue(v,type){if(v==null)return '';if(type==='number'&&!Number.isNaN(Number(v)))return Number(v).toLocaleString('ja-JP');return String(v)}
function joinedRows(t,relId){const r=relation(relId);if(!t||!r||r.fromTableId!==t.id)return {columns:t?.columns||[],data:(t?.rows||[]).map((row,i)=>({row,i}))};const other=findTable(r.toTableId);if(!other)return {columns:t.columns,data:t.rows.map((row,i)=>({row,i}))};
 const rightCols=other.columns.filter(col=>(!Array.isArray(r.relatedFields)||r.relatedFields.includes(col.key))&&col.key!==r.toKey);
 const cols=[...t.columns,...rightCols.map(c=>({...c,key:'join:'+c.key,label:other.name+' / '+c.label}))];
 const data=[];for(let i=0;i<t.rows.length;i++){const left=t.rows[i];let matches=other.rows.filter(rr=>v26Match(r,left,rr));if(!matches.length){if(r.joinType!=='inner')data.push({row:{...left,...Object.fromEntries(rightCols.map(c=>['join:'+c.key,'']))},i});continue}
 for(const match of matches)data.push({row:{...left,...Object.fromEntries(rightCols.map(c=>['join:'+c.key,match[c.key]]))},i})}
 return {columns:cols,data};}
function lookupValue(c){const r=relation(c.relationId),t=findTable(r?.toTableId);if(!r||!t)return '';if(r.keyMode&&r.keyMode!=='single')return '複数列の参照は一覧表で利用してください';const key=state.forms[c.sourceId];if(key==null||key==='')return '';const found=t.rows.find(row=>String(row[r.toKey]??'')===String(key));return found?String(found[c.displayField]??''):'（該当なし）'}
function refreshLookups(){for(const el of root.querySelectorAll('[data-lookup]')){const c=findComponent(el.dataset.lookup);if(c)el.textContent=lookupValue(c)}}

function gridTable(t,limit,query='',clickable=false,relId=''){if(!t)return `<div class="notice">テーブルが設定されていません。「データ管理」で追加してください。</div>`;
 const joined=joinedRows(t,relId),cols=joined.columns,q=String(query||'').toLocaleLowerCase();const visible=joined.data.filter(({row})=>!q||cols.some(col=>String(row[col.key]??'').toLocaleLowerCase().includes(q)));const shown=visible.slice(0,limit);
 return `<div class="table-wrap"><table class="app-table"><thead><tr>${cols.map(col=>`<th>${esc(col.label)}</th>`).join('')}</tr></thead><tbody>${shown.map(({row,i})=>`<tr ${clickable?`data-row-select="${attr(t.id)}" data-row-index="${i}"`:''} class="${state.selectedRow[t.id]===i&&clickable?'row-selected':''}">${cols.map(col=>`<td style="${attr(dbCellStyle(t,col.key,row))}">${esc(formatValue(row[col.key],col.type))}</td>`).join('')}</tr>`).join('')}${shown.length===0?`<tr><td colspan="${cols.length||1}" class="empty-line">一致するデータがありません</td></tr>`:''}</tbody></table></div>${visible.length>limit?`<p class="page-note">${visible.length}件中${shown.length}件を表示</p>`:clickable?`<p class="page-note">${visible.length}件表示 · 行をクリックして選択</p>`:''}`;
}
function agg(t,c){if(!t)return 0;let arr=t.rows.map(r=>Number(r[c.fieldKey])).filter(Number.isFinite);if(c.aggregate==='count')return t.rows.length;if(!arr.length)return 0;const sum=arr.reduce((a,b)=>a+b,0);return ({sum,avg:sum/arr.length,min:Math.min(...arr),max:Math.max(...arr)})[c.aggregate]??0}
function renderComponent(c,live){const disabled=live?'':' disabled tabindex="-1"';const value=state.forms[c.id];const t=findTable(c.tableId);switch(c.type){
 case 'heading':return `<h2 class="app-heading">${esc(c.label)}</h2>`;
 case 'text':return `<p class="app-text">${esc(c.label)}</p>`;
 case 'divider':return `<hr class="app-divider">`;
 case 'input':case 'number':return `<label class="control-label" for="f_${attr(c.id)}">${esc(c.label)} ${c.required?'<span style="color:#d64c62">*</span>':''}</label><input id="f_${attr(c.id)}" class="app-control" type="${c.type==='number'?'number':'text'}" placeholder="${attr(c.placeholder||'')}" value="${attr(value??'')}" ${live?`data-form="${attr(c.id)}"`:''}${disabled}>`;

 case 'select':{const source=findTable(c.optionsTableId);const opts=c.optionsMode==='table'&&source?source.rows.map(row=>[String(row[c.optionValueKey]??''),String(row[c.optionLabelKey]??row[c.optionValueKey]??'')]):String(c.options||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>[s,s]);return `<label class="control-label" for="f_${attr(c.id)}">${esc(c.label)}</label><select id="f_${attr(c.id)}" class="app-control" ${live?`data-form="${attr(c.id)}"`:''}${disabled}><option value="">選択してください</option>${opts.map(([key,label])=>`<option value="${attr(key)}" ${String(value??'')===key?'selected':''}>${esc(label)}</option>`).join('')}</select>`}
 case 'checkbox':return `<label class="app-checkbox"><input type="checkbox" ${value===true||value==='true'?'checked':''} ${live?`data-form="${attr(c.id)}"`:''}${disabled}>${esc(c.label)}</label>`;
 case 'button':return `<button class="app-btn ${attr(c.variant||'primary')}" ${live?`data-execute="${attr(c.id)}"`:''}${disabled}>${esc(c.label)}</button>`;

 case 'lookup':return `<div class="stat-card"><div class="stat-label">${esc(c.label)}</div><div data-lookup="${attr(c.id)}" style="font-size:15px;font-weight:800;margin-top:7px">${esc(live?lookupValue(c):'プレビューで参照値を表示')}</div></div>`;
 case 'chart':return componentChart(c);
 case 'stat':return `<div class="stat-card"><div class="stat-label">${esc(c.label)}</div><div class="stat-value">${esc(formatValue(agg(t,c),'number'))}<span class="stat-unit">${c.aggregate==='count'?'件':''}</span></div></div>`;

}}

function renderDataManager(){const t=findTable(state.tableId)||state.project.tables[0];if(t)state.tableId=t.id;const tBtns=state.project.tables.map(table=>`<button class="table-tab ${table.id===t?.id?'active':''}" data-open-table="${attr(table.id)}">▦ ${esc(table.name)} <span class="number-counter">${table.rows.length}</span></button>`).join('');let middle;if(!t){middle='<div class="empty">まだデータテーブルがありません。左から追加してください。</div>'}else{middle=`<div class="data-title"><div><h2>${esc(t.name)}</h2><p class="helper">列名・型・データを直接編集できます。変更は自動保存されます。</p></div><div class="button-row"><button class="btn small" data-action="row-add">＋ 行追加</button><button class="btn small" data-action="col-add">＋ 列追加</button><button class="btn small primary" data-v7-open>⇧ CSV / XLSXから登録</button><button class="btn small" data-action="table-xlsx">⇩ Excel保存</button><button class="btn small" data-action="csv-export">⇩ CSV保存</button></div></div><div class="field"><label>テーブル名</label><input class="form-control narrow-input" data-table-name value="${attr(t.name)}"></div><div class="notice">CSV・XLSXの見出しを照合し、新規登録・末尾追加・全行置換を選択できます。登録前にシートと列の対応を確認してください。</div><div class="data-sheet"><table><thead><tr><th>行</th>${t.columns.map((col,ci)=>`<th><div class="col-title"><input data-col-label="${ci}" value="${attr(col.label)}" title="列の表示名"></div><div class="col-meta"><select data-col-type="${ci}">${selectOptions([['text','文字'],['number','数値'],['date','日付']],col.type)}</select><button class="btn tiny danger" data-action="col-delete" data-col-index="${ci}" title="列を削除">×</button></div><div class="col-key">${esc(col.key)}</div></th>`).join('')}</tr></thead><tbody>${t.rows.slice(dataPageOffset(t),dataPageOffset(t)+dataPageSize).map((r,index)=>{const ri=dataPageOffset(t)+index;return `<tr><td><button class="btn tiny danger" data-action="row-delete" data-row-index="${ri}" title="行を削除">×</button> ${ri+1}</td>${t.columns.map(col=>`<td><input style="${attr(dbCellStyle(t,col.key,r))}" data-data-row="${ri}" data-data-key="${attr(col.key)}" type="${col.type==='number'?'number':col.type==='date'?'date':'text'}" value="${attr(r[col.key]??'')}"></td>`).join('')}</tr>`}).join('')}${!t.rows.length?`<tr><td colspan="${t.columns.length+1}" class="empty-line">データがありません。「行追加」または「CSV / XLSXから登録」を選んでください。</td></tr>`:''}</tbody></table></div><div class="button-row" style="margin-top:17px"><button class="btn small danger" data-action="table-delete">テーブルを削除</button><span class="helper">データ：${t.rows.length}行 / ${t.columns.length}列</span></div>`}return `<div class="data-area"><div class="data-layout"><aside class="table-list"><div class="side-heading">データテーブル</div>${tBtns}<button class="btn small soft" style="width:100%;margin-top:14px" data-action="table-add">＋ テーブル追加</button><button class="btn small soft" style="width:100%;margin-top:9px" data-v7-open>⇧ CSV / XLSXから登録</button><button class="btn small" style="width:100%;margin-top:9px" data-action="ana-export-all">⇩ 全テーブルをExcel保存</button><p class="helper" style="margin-top:21px">ここで定義したデータを、画面の入力欄・一覧・集計カードに接続できます。</p></aside><section class="data-panel">${middle}</section></div></div>`}

/* FLOW ENGINE --------------------------------------------------------- */
function selectedFlow(){return state.project.flows.find(f=>f.id===state.flowId)}
function selectedNode(){return selectedFlow()?.nodes.find(n=>n.id===state.selectedNodeId)}
const ACTION_OPTIONS=[['toast','メッセージ表示'],['navigate','画面移動'],['add','行追加'],['update','選択行の更新'],['delete','選択行の削除'],['clear','フォームクリア'],['search','検索'],['reset-search','検索解除'],['csv','CSV出力'],['setvalue','入力欄に値を設定'],['publish-analysis','分析結果を更新']];
function nodeDescription(n){if(n.type==='start')return '▶ ボタンから実行開始';if(n.type==='condition'){const source=findComponent(n.sourceId);return `${source?.label||'入力欄未設定'} / ${({eq:'等しい',neq:'等しくない',contains:'含む',notempty:'空でない',gt:'大きい',lt:'小さい'})[n.operator]||'条件未設定'} ${n.operator==='notempty'?'':String(n.value??'')}`}
 return ACTION_OPTIONS.find(x=>x[0]===n.operation)?.[1]||'アクションを選択';}
function nodeOutput(n,branch){return {x:n.x+204,y:n.y+(n.type==='condition'?(branch==='no'?115:78):99)}}
function nodeInput(n){return {x:n.x,y:n.y+56}}
function flowWireSvg(){const flow=selectedFlow();if(!flow)return '';let html='';for(const n of flow.nodes){for(const branch of (n.type==='condition'?['yes','no']:['next'])){const to=flow.nodes.find(t=>t.id===n[branch]);if(!to)continue;const a=nodeOutput(n,branch),b=nodeInput(to),d=Math.max(85,Math.abs(b.x-a.x)*.48);const stroke=branch==='yes'?'#13aa79':branch==='no'?'#eaa64c':'#5c8af2';html+=`<path d="M ${a.x} ${a.y} C ${a.x+d} ${a.y},${b.x-d} ${b.y},${b.x} ${b.y}" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round"/><circle cx="${b.x}" cy="${b.y}" r="4" fill="${stroke}"/>`}}return html}
function renderFlowEditor(){const flow=selectedFlow();return `<div class="flow-layout"><aside class="flow-left"><div class="side-heading">処理フロー</div>${state.project.flows.map(f=>`<button class="flow-option ${f.id===state.flowId?'current':''}" data-open-flow="${attr(f.id)}"><span>◇</span><span class="flow-name">${esc(f.name)}</span></button>`).join('')}<button class="btn small soft" data-action="flow-add">＋ 新しいフロー</button><details style="margin-top:12px"><summary>使い方</summary><ol class="helper" style="padding-left:20px"><li>新しいフローを作成</li><li>アクション・条件分岐を追加し、ノードを選んで右側で設定</li><li>出力端子を押し、接続先ノードをクリック</li><li>画面デザインのボタンで「視覚フローを実行」を指定し、このフローを選択</li><li>動作プレビューで入力してボタンを押す</li></ol><p class="helper">条件は画面の入力値を参照します。テストもデータ登録・削除などの処理を実際に実行します。</p></details><div class="side-heading" style="margin-top:22px">ノードの追加</div><button class="btn small" data-action="node-add" data-node-type="action">＋ アクション</button><button class="btn small" data-action="node-add" data-node-type="condition">＋ 条件分岐</button><p class="helper">「接続 →」から接続先のノードをクリックします。条件分岐は YES / NO を別々に接続できます。ノード上部をドラッグすると移動します。</p><button class="btn small" data-action="flow-run">▷ フローをテスト</button></aside><main class="flow-center"><div class="canvas-topline" style="max-width:none"><div><h2>◇ ${esc(flow?.name||'処理フローを追加してください')}</h2>${flow?`<label class="helper">フロー名 <input id="v71-flow-name" class="form-control" data-v71-flow-name value="${attr(flow.name)}" style="max-width:360px;margin-top:6px"></label>`:''}<p>ドラッグでノードを配置し、出力端子から処理を連結</p></div><div class="button-row"><button class="btn small" data-action="flow-rename">✎ 名前変更</button><button class="btn small danger" data-action="flow-delete">削除</button></div></div>${state.connecting?`<div class="flow-link-hint">接続先のノードをクリックしてください（ESCでキャンセル）</div>`:''}${flow?`<div class="flow-board" id="flow-board"><svg class="flow-lines" viewBox="0 0 1160 760" preserveAspectRatio="none" id="flow-lines">${flowWireSvg()}</svg>${flow.nodes.map(n=>`<div class="flow-node ${n.type} ${n.id===state.selectedNodeId?'selected':''}" data-flow-node="${attr(n.id)}" style="left:${n.x}px;top:${n.y}px"><span class="flow-destination"></span><div class="flow-node-head" data-flow-grip="${attr(n.id)}"><span>${n.type==='start'?'▶ 開始':n.type==='condition'?'◇ 条件':'▣ 処理'}</span><span style="opacity:.5">⠿</span></div><div class="flow-node-body">${esc(nodeDescription(n))}</div><div class="flow-port-list">${n.type==='condition'?`<button class="flow-port yes" data-flow-connect="${attr(n.id)}" data-branch="yes">YES →</button><button class="flow-port no" data-flow-connect="${attr(n.id)}" data-branch="no">NO →</button>`:`<button class="flow-port" data-flow-connect="${attr(n.id)}" data-branch="next">接続 →</button>`}</div></div>`).join('')}</div>`:'<div class="empty">左の「新しいフロー」から作成します。</div>'}</main><aside class="flow-right">${renderFlowInspector()}</aside></div>`}
function flowNodeField(title,key,value){return `<div class="field"><label>${esc(title)}</label><input class="form-control" data-node-prop="${attr(key)}" value="${attr(value??'')}"></div>`}
function flowNodeSelect(title,key,options,value){return `<div class="field"><label>${esc(title)}</label><select class="form-control" data-node-prop="${attr(key)}">${selectOptions(options,value)}</select></div>`}
function renderFlowInspector(){const n=selectedNode();if(!n)return '<div class="side-heading">ノード設定</div><p class="helper">ノードを選ぶと処理内容を設定できます。右のエディタはJavaScriptの記述不要です。</p>';let out=`<div class="side-heading">ノード設定</div><h3>${n.type==='start'?'開始ノード':n.type==='condition'?'条件分岐':'アクション'}</h3>`;
 if(n.type==='condition'){out+=flowNodeSelect('参照する入力欄','sourceId',inputOptions(),n.sourceId);out+=flowNodeSelect('判定方法','operator',[['notempty','空でない'],['eq','等しい'],['neq','等しくない'],['contains','文字を含む'],['gt','数値より大きい'],['lt','数値より小さい']],n.operator);if(n.operator!=='notempty')out+=flowNodeField('比較する値','value',n.value)}
 if(n.type==='action'){out+=flowNodeSelect('実行する処理','operation',ACTION_OPTIONS,n.operation);if(n.operation==='toast')out+=flowNodeField('表示メッセージ','message',n.message);if(n.operation==='navigate')out+=flowNodeSelect('移動先画面','targetPageId',pageOptions(),n.targetPageId);if(['add','update','delete','clear','search','reset-search','csv'].includes(n.operation))out+=flowNodeSelect('対象テーブル','tableId',tableOptions(),n.tableId);if(['setvalue','search'].includes(n.operation))out+=flowNodeSelect('参照する入力欄','sourceId',inputOptions(),n.sourceId);if(n.operation==='setvalue')out+=flowNodeField('設定する値','value',n.value)}
 out+=`<div class="notice">線の付け替え：出力端子を押してから次のノードをクリックします。接続削除は下のボタンを使用します。</div>`;
 for(const branch of (n.type==='condition'?['yes','no']:['next']))if(n[branch])out+=`<button class="btn small danger" data-action="flow-unlink" data-branch="${branch}">${branch.toUpperCase()} 接続を解除</button>`;
 if(n.type!=='start')out+=`<button class="btn small danger" style="margin-top:10px;width:100%" data-action="node-delete">ノードを削除</button>`;return out}
function conditionMatches(node){const raw=state.forms[node.sourceId];const a=String(raw??''),b=String(node.value??'');switch(node.operator){case 'notempty':return a.trim()!=='';case 'eq':return a===b;case 'neq':return a!==b;case 'contains':return a.includes(b);case 'gt':return a.trim()!==''&&Number.isFinite(Number(a))&&Number(a)>Number(b);case 'lt':return a.trim()!==''&&Number.isFinite(Number(a))&&Number(a)<Number(b);default:return false}}
function runFlow(flowId){const flow=state.project.flows.find(f=>f.id===flowId);if(!flow){message('フローが設定されていません',true);return}let n=flow.nodes.find(n=>n.type==='start');if(!n){message('開始ノードがありません',true);return}let steps=0;while(n&&steps++<60){if(n.type==='condition'){const result=conditionMatches(n);n=flow.nodes.find(x=>x.id===(result?n.yes:n.no));continue}if(n.type==='action'){if(n.operation==='setvalue'){if(n.sourceId)state.forms[n.sourceId]=n.value??'';render()}else if(n.operation)execute({...n,action:n.operation});}n=flow.nodes.find(x=>x.id===n.next)}if(steps>=60)message('フローを60ステップで停止しました。循環接続を確認してください',true)}

iv><div class="relation-preview">${gridTable(from,10,'',false,r.id)}</div><div class="button-row" style="margin-top:18px"><button class="btn danger small" data-action="relation-delete">このリレーションを削除</button><span class="helper">※ 参照元のデータを変更せず仮想結合します</span></div>`:'<div class="empty">リレーションを追加してテーブル間のキーを関連付けてください。</div>'}</section></div></div></div>`}

const MAX_ANALYSIS_ROWS=30000;
function ensureAnalytics(){
 const p=state.project;if(!p.analytics||typeof p.analytics!=='object')p.analytics={};const a=p.analytics;
 if(!('sourceId'in a))a.sourceId=p.tables[0]?.id||'';
 if(!('joinId'in a))a.joinId='';
 if(!('leftKey'in a))a.leftKey='';
 if(!('rightKey'in a))a.rightKey='';
 if(!('joinMode'in a))a.joinMode='left';
 if(!('filterKey'in a))a.filterKey='';
 if(!('filterMode'in a))a.filterMode='contains';
 if(!('filterValue'in a))a.filterValue='';
 if(!('calcName'in a))a.calcName='';
 if(!('calcLeft'in a))a.calcLeft='';
 if(!('calcOp'in a))a.calcOp='multiply';
 if(!('calcRight'in a))a.calcRight='';if(!('calcConstant'in a))a.calcConstant='10';
 if(!('groupKey'in a))a.groupKey='';
 if(!('pivotKey'in a))a.pivotKey='';
 if(!('metricKey'in a))a.metricKey='';
 if(!('aggregate'in a))a.aggregate='sum';
 if(!('resultName'in a))a.resultName='分析結果';
 return a;
}
function analyticSourceColumns(a){
 const src=findTable(a.sourceId),right=findTable(a.joinId);
 return [...(src?.columns||[]).map(c=>({...c})),...(src&&right&&src.id!==right.id?right.columns.map(c=>({...c,key:'join:'+c.key,label:right.name+' / '+c.label})):[])];
}
function analyticsColumns(a){const cols=analyticSourceColumns(a);if(a.calcName?.trim())cols.push({key:'calculated',label:a.calcName.trim(),type:'number'});return cols}
function numberValue(v){if(v==null||String(v).trim()==='')return null;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:null}
function analysisFilter(row,a){if(!a.filterKey)return true;const v=row[a.filterKey],target=a.filterValue??'',str=String(v??'').toLocaleLowerCase(),q=String(target).toLocaleLowerCase();if(a.filterMode==='empty')return v==null||v==='';if(a.filterMode==='notempty')return v!=null&&v!=='';
 if(a.filterMode==='eq')return str===q;if(a.filterMode==='neq')return str!==q;
 if(a.filterMode==='gt')return numberValue(v)!==null&&numberValue(target)!==null&&numberValue(v)>numberValue(target);
 if(a.filterMode==='gte')return numberValue(v)!==null&&numberValue(target)!==null&&numberValue(v)>=numberValue(target);
 if(a.filterMode==='lt')return numberValue(v)!==null&&numberValue(target)!==null&&numberValue(v)<numberValue(target);
 return str.includes(q);
}
function calcOperand(row,key){if(String(key).startsWith('#'))return numberValue(String(key).slice(1));return numberValue(row[key]);}
function analysisMetric(rows,key,op){if(op==='count')return rows.length;const a=rows.map(r=>numberValue(r[key])).filter(x=>x!==null);if(!a.length)return 0;if(op==='min')return Math.min(...a);if(op==='max')return Math.max(...a);const total=a.reduce((x,y)=>x+y,0);if(op==='avg')return Math.round(total/a.length*10000)/10000;return Math.round(total*10000)/10000;}
function analysisCompute(a=ensureAnalytics()){
 const src=findTable(a.sourceId);if(!src)return {columns:[],rows:[],sourceCount:0,joinCount:0,filterCount:0,error:'参照元テーブルを選択してください'};
 const right=findTable(a.joinId),joined=!!(right&&src.id!==right.id&&a.leftKey&&a.rightKey);
 const rcols=joined?right.columns.map(c=>({...c,key:'join:'+c.key,label:right.name+' / '+c.label})):[];
 const sourceCols=[...src.columns.map(c=>({...c})),...rcols];
 const maxRows=MAX_ANALYSIS_ROWS;
 let rows=[];
 if(joined){const index=new Map();for(const r of right.rows){const k=String(r[a.rightKey]??'');if(!k)continue;if(!index.has(k))index.set(k,[]);index.get(k).push(r)}
 for(const l of src.rows){const matches=index.get(String(l[a.leftKey]??''))||[];if(!matches.length){if(a.joinMode!=='inner')rows.push({...l,...Object.fromEntries(rcols.map(c=>[c.key,'']))})}else for(const m of matches){rows.push({...l,...Object.fromEntries(right.columns.map(c=>['join:'+c.key,m[c.key]??'']))});if(rows.length>=maxRows)break}if(rows.length>=maxRows)break}
 }else rows=src.rows.slice(0,maxRows).map(r=>({...r}));
 const joinCount=rows.length;rows=rows.filter(r=>analysisFilter(r,a));const filterCount=rows.length;
 if(a.calcName?.trim()&&a.calcLeft){rows=rows.map(r=>{const x=calcOperand(r,a.calcLeft),y=calcOperand(r,a.calcRight==='#custom'?'#'+(a.calcConstant||0):a.calcRight);let n='';if(x!==null&&y!==null){switch(a.calcOp){case 'add':n=x+y;break;case 'subtract':n=x-y;break;case 'divide':n=y===0?'':x/y;break;default:n=x*y}if(typeof n==='number')n=Math.round(n*1e8)/1e8}return {...r,calculated:n}})}
 let columns=a.calcName?.trim()?[...sourceCols,{key:'calculated',label:a.calcName.trim(),type:'number'}]:sourceCols;
 if(a.groupKey){const groups=new Map();for(const r of rows){const k=String(r[a.groupKey]??'');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
 const label=columns.find(c=>c.key===a.groupKey)?.label||a.groupKey;
 if(a.pivotKey&&a.pivotKey!==a.groupKey){const cats=[...new Set(rows.map(r=>String(r[a.pivotKey]??'')))].slice(0,40);const pivotCols=cats.map((v,i)=>({key:'pivot_'+i,label:v||'(空白)',type:'number'}));columns=[{key:'group',label,type:'text'},...pivotCols,{key:'total',label:'合計',type:'number'}];rows=[...groups].map(([group,items])=>{const out={group},total=analysisMetric(items,a.metricKey,a.aggregate);for(let i=0;i<cats.length;i++)out['pivot_'+i]=analysisMetric(items.filter(r=>String(r[a.pivotKey]??'')===cats[i]),a.metricKey,a.aggregate);out.total=total;return out})}
 else {columns=[{key:'group',label,type:'text'},{key:'value',label:({count:'件数',sum:'合計',avg:'平均',min:'最小',max:'最大'})[a.aggregate]||'集計値',type:'number'}];rows=[...groups].map(([group,items])=>({group,value:analysisMetric(items,a.metricKey,a.aggregate)}))}
 rows.sort((x,y)=>(Number(y.value??y.total)||0)-(Number(x.value??x.total)||0));
 }
 return {columns,rows,sourceCount:src.rows.length,joinCount,filterCount,limited:joined&&joinCount>=maxRows||src.rows.length>maxRows};
}
function analysisProfile(result){const out=[];const n=result.rows.length;
 for(const c of result.columns.slice(0,45)){const vals=result.rows.map(r=>r[c.key]);const missing=vals.filter(v=>v==null||String(v).trim()==='').length;const nonempty=vals.filter(v=>v!=null&&v!=='');const nums=nonempty.map(numberValue).filter(x=>x!==null);let anomalies=0,min='',max='';if(nums.length>=5){const mean=nums.reduce((a,b)=>a+b,0)/nums.length;const sd=Math.sqrt(nums.reduce((a,b)=>a+(b-mean)**2,0)/nums.length);anomalies=sd?nums.filter(x=>Math.abs(x-mean)/sd>3).length:0}if(nums.length){min=Math.min(...nums);max=Math.max(...nums)}out.push({label:c.label,missing,unique:new Set(vals.map(x=>String(x??''))).size,numeric:nonempty.length>0&&nums.length===nonempty.length,min,max,anomalies})}
 return out;
}

function createImportedTable(name,cells){let grid=cells.filter(row=>Array.isArray(row)&&row.some(v=>String(v??'').trim()!==''));if(!grid.length)return null;const heads=grid.shift();const used=new Set();const columns=heads.map((v,i)=>{let label=String(v??'').trim()||'列'+(i+1);if(used.has(label))label+='_'+(i+1);used.add(label);const values=grid.slice(0,80).map(r=>r[i]).filter(x=>x!==''&&x!=null);return {key:'c'+(i+1),label,type:values.length&&values.every(v=>numberValue(v)!==null)?'number':'text'}});
 const rows=grid.slice(0,MAX_ANALYSIS_ROWS).map(cells=>Object.fromEntries(columns.map((c,i)=>[c.key,c.type==='number'?numberValue(cells[i])??'':cells[i]??''])));return {id:uid('table'),name,columns,rows};}
function importTables(tables){if(!tables.length){message('読み込める表がありませんでした',true);return}let added=[];for(const table of tables){if(!table||!table.rows.length)continue;const existing=new Set(state.project.tables.map(x=>x.name));let name=table.name,index=2;while(existing.has(name))name=table.name+' ('+(index++)+')';table.name=name;state.project.tables.push(table);added.push(table)}if(added.length){state.tableId=added[0].id;ensureAnalytics().sourceId=added[0].id;persist();render();message(added.length+'テーブル、合計'+added.reduce((x,t)=>x+t.rows.length,0)+'行を取り込みました')}else message('有効なデータ行がありません',true)}

function querySafeFileName(s){return String(s||'クエリ').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)}
function queryOutput(q=activeQuery(),notify=true){const res=queryCompute(q);if(res.error){if(notify)message('ステップでエラー: '+res.error.message,true);return false}if(!res.final.columns.length){if(notify)message('出力データがありません',true);return false}const name='Q：'+q.name;let t=state.project.tables.find(t=>t.queryOutputId===q.id);if(!t){t={id:uid('table'),name,queryOutputId:q.id,columns:[],rows:[]};state.project.tables.push(t)}t.name=name;t.columns=clone(res.final.columns);t.rows=clone(res.final.rows);state.tableId=t.id;persist();if(notify)message('「'+q.name+'」を再実行し、'+t.rows.length+'行をアプリに反映しました');return true;}

function importQueryRecipe(data){if(data.format!=='BusinessAppStudioQueryV4'||!data.query||!Array.isArray(data.query.steps))throw Error('対応していないクエリ設定です');if(data.query.steps.length>150)throw Error('ステップが多すぎます');const recipe=clone(data.query);if(Array.isArray(data.parameters)){state.project.parameters=state.project.parameters||[];for(const p of data.parameters)if(typeof p.name==='string'&&!state.project.parameters.some(x=>x.name===p.name))state.project.parameters.push({name:p.name,value:String(p.value??'')})}const previous=new Map((data.references||[]).map(t=>[t.id,t]));const remap={};for(const [id,src] of previous){const match=findTable(id)||state.project.tables.find(t=>t.name===src.name);if(match)remap[id]=match.id}
 recipe.id=uid('query');recipe.name=(recipe.name||'読込クエリ')+' (読込)';recipe.sourceId=remap[recipe.sourceId]||recipe.sourceId;
 for(const step of recipe.steps){/* Keep step IDs: downstream generated keys depend on them; scoped to each query. */if(['join','multiJoin','diff'].includes(step.type))step.tableId=remap[step.tableId]||step.tableId;step.enabled=step.enabled!==false}
 /* Preserve join-derived column keys on imported recipes: old IDs inside their prefixes
    are not changed, and remain consistent with step ids in downstream keys. */
 const q=recipe;ensureQueries().push(q);state.queryId=q.id;state.queryStepId=q.steps.at(-1)?.id||'';persist();render();let missing=!findTable(q.sourceId)||q.steps.some(s=>['join','multiJoin','diff'].includes(s.type)&&!findTable(s.tableId));message(missing?'設定を読み込みました。未接続の元テーブルを再選択してください。':'クエリ設定を読み込みました。実行して結果を確認できます。',missing)}
function queryMakeReplaceRows(source,grid){const fresh=createImportedTable('temp',grid);if(!fresh)throw Error('データを読み取れませんでした');const expected=source.columns.map(c=>c.label),actual=fresh.columns.map(c=>c.label);const missing=expected.filter(x=>!actual.includes(x));if(missing.length)throw Error('必要な列が見つかりません: '+missing.join(', ')+'。列の表示名を確認してください');if(new Set(actual).size!==actual.length)throw Error('読み込み元に同名の列が重複しています');if(fresh.rows.length>=MAX_ANALYSIS_ROWS)throw Error('更新行数が上限 '+MAX_ANALYSIS_ROWS.toLocaleString()+' 件に達しました。元データを分割してください');const out=fresh.rows.map(r=>Object.fromEntries(source.columns.map(c=>{const idx=actual.indexOf(c.label),from=fresh.columns[idx];const v=r[from.key];return [c.key,c.type==='number'?numberValue(v)??'':v??'']})));return {rows:out,imported:fresh.rows.length,ignored:Math.max(0,actual.length-expected.length)}}
async function queryReplaceFromFile(file){const target=findTable(document.getElementById('query-replace-target')?.value||activeQuery().sourceId);if(!target)throw Error('差し替え対象のテーブルを選択してください');if(target.analyticsOutput||target.queryOutputId)throw Error('集計出力テーブルは差し替えできません。元テーブルを選択してください');let grids=[];if(/\.xlsx$/i.test(file.name)){grids=(await xlsxFromZip(await file.arrayBuffer())).map(s=>({name:s.name,grid:s.grid}))}else if(/\.csv$/i.test(file.name)){grids=[{name:file.name,grid:parseCSV(await readFile(file))}]}else if(/\.tsv$/i.test(file.name)){grids=[{name:file.name,grid:(await readFile(file)).replace(/^\ufeff/,'').split(/\r?\n/).map(s=>s.split('\t'))}]}else throw Error('xlsx、csv、tsvファイルを選んでください');if(!grids.length)throw Error('読み込めるシートがありません');
 let sheet=grids[0];if(grids.length>1){const expectedName=target.name.split(' / ').at(-1);const ix=grids.findIndex(s=>s.name===expectedName);if(ix>=0)sheet=grids[ix];else{const picked=prompt('読み込むシート番号を指定してください：\n'+grids.map((s,i)=>`${i+1}：${s.name}`).join('\n'),'1');if(picked===null)return;const n=Number(picked)-1;if(!Number.isInteger(n)||n<0||n>=grids.length)throw Error('シート番号が正しくありません');sheet=grids[n]}}
 const prepared=queryMakeReplaceRows(target,sheet.grid);if(!confirm(`「${target.name}」の${target.rows.length}件を「${sheet.name}」の${prepared.imported}件で置き換えます。\n※ 同じ列名のデータを照合し、列キーは維持されます。よろしいですか？`))return;
 target.rows=prepared.rows;
 // Refresh previously published queries whose source or join uses the replaced table.
 // Queries that have not been published still update immediately in the preview.
 let updated=0,failures=[];
 for(const q of ensureQueries()){
   if(!state.project.tables.some(t=>t.queryOutputId===q.id))continue;
   if(q.sourceId!==target.id&&!q.steps.some(st=>st.type==='join'&&st.tableId===target.id))continue;
   if(queryOutput(q,false))updated++;else failures.push(q.name);
 }
 persist();render();message('「'+target.name+'」を'+prepared.imported+'行に更新しました。公開済みクエリ'+updated+'件を自動再実行しました。'+(failures.length?'（エラー: '+failures.join('、')+'）':''),!!failures.length);}

function v5Date(value){
 const m=String(value).trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
 if(!m)throw Error('日付は YYYY-MM-DD または YYYY/MM/DD で指定');
 const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(0);dt.setUTCFullYear(y,mo-1,d);dt.setUTCHours(0,0,0,0);
 if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)throw Error('存在しない日付');
 return `${m[1]}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
queryExecuteStep=function(input,s){

  rows=rows.filter(r=>{const k=JSON.stringify(r);return s.logic==='or'?sets.some(set=>set.has(k)):sets.every(set=>set.has(k))});
 }else{
  const col=queryColumn(input,s.key);
  if(s.type==='split'){
   if(!s.delimiter)throw Error('区切り文字を入力してください');
   const names=String(s.names||'').split(',').map(x=>x.trim());if(names.length<2||names.some(x=>!x)||new Set(names).size!==names.length)throw Error('異なる出力列名をカンマ区切りで2つ以上指定してください');
   const added=names.map((label,i)=>({key:'split_'+s.id+'_'+i,label,type:'text'}));
   if(added.some(a=>columns.some(c=>c.key===a.key||c.label===a.label)))throw Error('出力列名が既存の列と重複しています');
   rows=rows.map(r=>{const parts=String(r[s.key]??'').split(s.delimiter),out={...r};added.forEach((c,i)=>out[c.key]=i===added.length-1?parts.slice(i).join(s.delimiter):parts[i]??'');return out});columns.push(...added);
  }else if(s.type==='replace'){
   if(s.find==null||s.find==='')throw Error('検索文字列を入力してください');
   rows=rows.map(r=>({...r,[s.key]:r[s.key]==null?r[s.key]:s.replaceMode==='exact'?(String(r[s.key])===s.find?s.replacement||'':r[s.key]):String(r[s.key]).split(s.find).join(s.replacement||'')}));

function v5ApplyTemplate(t,sourceId){

 const old=t.references.find(r=>r.id===t.query.sourceId);if(!old)throw Error('テンプレートの元列定義がありません');
 const map=new Map(old.columns.map(c=>{const matches=source.columns.filter(x=>x.label===c.label);return [c.key,matches.length===1?matches[0].key:null]}));
 const q=clone(t.query);q.id=uid('query');q.name=t.name+'（適用）';q.sourceId=source.id;
 const baseFields=['leftKey','key','left','right','groupKey','metricKey','sortKey','attributeKey','valueKey'];
 const remap=k=>{if(map.has(k)){if(!map.get(k))throw Error('元テーブルに一意な列「'+old.columns.find(c=>c.key===k).label+'」がありません');return map.get(k)}return k};

function v5Merge(grids,name){
 let headers=null,columns=null,rows=[];
 for(const g of grids){const grid=g.grid.filter(r=>r.some(v=>v!=null&&v!==''));if(!grid.length)continue;
  const h=Array.from(grid[0],v=>String(v??'').trim());if(!h.length||h.some(x=>!x)||new Set(h).size!==h.length)throw Error(g.name+': ヘッダーに空欄または重複があります');

  const indices=headers.map(x=>h.indexOf(x));for(const r of grid.slice(1)){if(rows.length>=MAX_ANALYSIS_ROWS)throw Error('合計30,000行を超えるため一括結合を中止しました');rows.push({...Object.fromEntries(columns.map((c,i)=>[c.key,r[indices[i]]??''])),__v5_file:g.file,__v5_sheet:g.name})}

 div.querySelector('#v7-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>25*1024*1024)throw Error('25MB以下のファイルを選択してください');let sheets;if(/\.xlsx$/i.test(file.name))sheets=await xlsxFromZip(await file.arrayBuffer(),true);else if(/\.csv$/i.test(file.name))sheets=[{name:file.name,grid:parseCSV(await readFile(file))}];else throw Error('CSVまたはXLSXを選択してください');if(v7Session!==s)return;if(!sheets.length)throw Error('読み込めるシートがありません');s.sheets=sheets;s.sheet=0;s.name=file.name.replace(/\.(xlsx|csv)$/i,'');s.fileName=file.name;v7AutoMap();v7Render()}catch(e){if(v7Session===s){s.sheets=[];v7Render();const p=document.createElement('p');p.textContent=e.message;p.style.color='#b42318';document.querySelector('#v7-import-dialog section')?.append(p)}}});
 div.querySelector('#v7-sheet')?.addEventListener('change',e=>{s.sheet=+e.target.value;v7AutoMap();v7Render()});div.querySelector('#v7-mode')?.addEventListener('change',e=>{s.mode=e.target.value;v7Render()});div.querySelector('#v7-name')?.addEventListener('input',e=>s.name=e.target.value);div.querySelectorAll('[data-v7-map]').forEach(el=>el.addEventListener('change',()=>s.mapping[el.dataset.v7Map]=el.value));div.querySelector('[data-v7="close"]').onclick=v7Close;div.querySelector('[data-v7="commit"]')?.addEventListener('click',()=>{try{v7Commit()}catch(e){div.querySelector('#v7-error').textContent=e.message}});
}
function v7AutoMap(){const s=v7Session,t=findTable(s.targetId);s.mapping={};let p;try{p=v7Grid(s.sheets[s.sheet].grid)}catch(e){return}for(const c of t?.columns||[]){const i=p.headers.findIndex(h=>h===c.label||h===c.key);if(i>=0)s.mapping[c.key]=String(i)}}
function v7Commit(){const s=v7Session;if(!s?.sheets.length)throw Error('ファイルを選択してください');const parsed=v7Grid(s.sheets[s.sheet].grid);let t=findTable(s.targetId);if(s.mode==='new'){if(isPlayer)throw Error('新規テーブル登録は編集画面で行ってください');if(!s.name.trim())throw Error('テーブル名を入力してください');t={id:uid('table'),name:s.name.trim(),columns:parsed.headers.map((label,i)=>({key:'file_'+i,label,type:'text'})),rows:parsed.rows.map(r=>Object.fromEntries(parsed.headers.map((h,i)=>['file_'+i,String(r[i]??'')])))};state.project.tables.push(t)}else{if(!t)throw Error('登録先がありません');if(t.queryOutputId||t.queryErrorId||t.analyticsOutput)throw Error('計算結果テーブルには登録できません。元データを選択してください');if(new Set(Object.values(s.mapping)).size!==t.columns.length)throw Error('各列に異なる読込列を指定してください');const rows=v7Records(parsed,t,s.mapping);if((s.mode==='append'?t.rows.length:0)+rows.length>MAX_ANALYSIS_ROWS)throw Error('登録後の行数が30,000件を超えます');if(s.mode==='replace'&&!confirm('「'+t.name+'」の'+t.rows.length+'行を'+rows.length+'行で置き換えますか？'))return;t.rows=s.mode==='replace'?rows:[...t.rows,...rows]}state.tableId=t.id;delete state.selectedRow[t.id];state.filters[t.id]='';persist();v7Close();render();message(parsed.rows.length+'行を「'+t.name+'」に登録しました')}

function basPropTip(el){
 const d=el.dataset||{},c=findComponent(state.selectedId);
 if(d.prop!==undefined){
  if(d.prop==='sourceId')return BAS_PROP_SRC[c?.type]||BAS_PROP_SRC._;
  if(d.prop==='fieldKey'&&c?.type==='stat')return '集計（合計・平均など）する数値の列です。';
  return BAS_PROP[d.prop]||null}
 if(d.nodeProp!==undefined)return BAS_NODE[d.nodeProp]||null;
 if(d.anaProp!==undefined)return BAS_ANA[d.anaProp]||null;
 if(d.queryProp!==undefined)return BAS_QUERY[d.queryProp]||null;
 if(d.relProp!==undefined)return BAS_REL[d.relProp]||null;
 return null}
function basTipFor(el){
 const d=el.dataset||{};
 if(d.tip)return d.tip;
 if(d.bas&&BAS_BAS[d.bas])return BAS_BAS[d.bas];
 if(d.tab&&BAS_TAB[d.tab])return BAS_TAB[d.tab];
 if(d.addType){const t=BAS_COMP[d.addType];return t?[compLabel(d.addType),t+'（クリックで追加。キャンバスへドラッグしても置けます）']:null}
 if(el.classList.contains('v8-operation'))return null;
 if(d.action==='query-add-step'){const g=V8_GUIDE[d.stepType];return g?[g[0],g[1]]:null}
 if(d.action==='node-add')return BAS_NODEADD[d.nodeType]||null;
 if(d.action&&BAS_ACTION[d.action])return BAS_ACTION[d.action];
 for(const k of ['v5','v6','v8','v14','v18','v10'])if(d[k]&&BAS_V[k+':'+d[k]])return BAS_V[k+':'+d[k]];
 if(d.v12Preset)return BAS_PRESET;
 if(d.v7Open!==undefined)return BAS_V['v7:open'];
 if(d.v18Open!==undefined)return BAS_V['v18:open'];
 if(d.v71Example!==undefined)return BAS_V['v71:example'];
 if(d.openPage!==undefined)return el.closest('.viewer-nav')?'クリックでこの画面に切り替えます。':['画面を選ぶ','クリックすると、この画面を編集できます。'];
 if(d.openTable!==undefined)return ['テーブルを選ぶ','クリックすると、このテーブルのデータを表示・編集できます。'];
 if(d.openFlow!==undefined)return 'クリックで、このフローを編集します。';
 if(d.openRelation!==undefined)return 'クリックで、この結合設定を編集します。';
 if(d.flowConnect!==undefined){const b=d.branch;return b==='yes'?['YES →','条件に合ったときに進む先です。押してから、接続先のノードをクリックします。']:b==='no'?['NO →','条件に合わなかったときに進む先です。押してから、接続先のノードをクリックします。']:['接続 →','次に進むノードをつなぎます。押してから、接続先のノードをクリックします（Escで中止）。']}

function formatStorageKey(project=state.project){return (isPlayer?KEY_PLAYER:KEY_BUILDER)+':'+project.id}
function formatStoreAccess(mode,callback){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('このブラウザでは追加の保存領域を利用できません'));return}const request=indexedDB.open('BusinessAppStudioAppearance',1);request.onupgradeneeded=()=>request.result.createObjectStore('formats');request.onerror=()=>reject(request.error||Error('保存領域を開けません'));request.onblocked=()=>reject(Error('別のタブを閉じて再実行してください'));request.onsuccess=()=>{const db=request.result;let transaction,result;try{transaction=db.transaction('formats',mode);result=callback(transaction.objectStore('formats'))}catch(e){db.close();reject(e);return}transaction.oncomplete=()=>{const value=result?.result;db.close();resolve(value)};transaction.onerror=()=>{db.close();reject(transaction.error||Error('保存に失敗しました'))};transaction.onabort=()=>{db.close();reject(transaction.error||Error('保存が中断されました'))}}})}
const formatBaseSignatures=new Map();
async function saveFormatRules(t,rules){const key=formatStorageKey()+':'+t.id,old=JSON.stringify(t.conditionalFormats||[]),base=formatBaseSignatures.get(key)??old,entry={base,rules:clone(rules),updated:new Date().toISOString()};try{await formatStoreAccess('readwrite',store=>store.put(entry,key))}catch(e){throw Error('書式を保存できませんでした。ブラウザの保存設定をご確認ください：'+e.message)}if(findTable(t.id)!==t)throw Error('保存中にテーブルが変更されました。設定を開き直してください');formatBaseSignatures.set(key,base);t.conditionalFormats=clone(rules);refreshVisibleFormats(t)}
async function loadFormatRules(){const project=state.project,prefix=formatStorageKey(project);let changed=false;try{for(const t of project.tables){const key=prefix+':'+t.id,entry=await formatStoreAccess('readonly',store=>store.get(key));if(state.project!==project)return;if(!entry||!Array.isArray(entry.rules))continue;const current=JSON.stringify(t.conditionalFormats||[]);if(current!==entry.base&&current!==JSON.stringify(entry.rules))continue;formatBaseSignatures.set(key,entry.base);t.conditionalFormats=entry.rules;changed=true}if(changed)render()}catch(e){message('条件付き書式の保存設定を読み込めませんでした：'+e.message,true)}}
async function clearStoredFormats(all){if(!window.indexedDB)return;const prefix=formatStorageKey()+':';await formatStoreAccess('readwrite',store=>{if(all)return store.clear();const request=store.openCursor();request.onsuccess=()=>{const cursor=request.result;if(!cursor)return;if(String(cursor.key).startsWith(prefix))cursor.delete();cursor.continue()};return request})}

const dm={tableId:'',q:'',fcol:'',fop:'contains',fval:'',sortKey:'',sortDir:1,page:0,sel:new Set(),dupCols:null};
const DM_PAGE=100;
function dmNorm(v){return String(v??'').normalize('NFKC').toLowerCase()}
function dmBlank(v){return v==null||String(v).trim()===''}
function dmTable(){return findTable(dm.tableId)||findTable(state.tableId)}
function dmReset(t){Object.assign(dm,{tableId:t.id,q:'',fcol:'',fop:'contains',fval:'',sortKey:'',sortDir:1,page:0,dupCols:null});dm.sel.clear()}
function dmCmp(col,dir){
 const num=col.type==='number';
 return (a,b)=>{
  const x=a[col.key],y=b[col.key],bx=dmBlank(x),by=dmBlank(y);
  if(bx&&by)return 0;if(bx)return 1;if(by)return -1;
  if(num){const nx=Number(x),ny=Number(y);if(isFinite(nx)&&isFinite(ny))return (nx-ny)*dir}
  return String(x).localeCompare(String(y),'ja',{numeric:true})*dir}}
function dmFiltered(t){
 let idx=t.rows.map((_,i)=>i);
 const q=dmNorm(dm.q).trim();
 if(q){const words=q.split(/\s+/);idx=idx.filter(i=>{const text=t.columns.map(c=>dmNorm(t.rows[i][c.key])).join('\t');return words.every(w=>text.includes(w))})}
 const col=t.columns.find(c=>c.key===dm.fcol);
 if(col){
  const op=dm.fop,val=dm.fval,nv=dmNorm(val).trim();
  if(op==='empty')idx=idx.filter(i=>dmBlank(t.rows[i][col.key]));
  else if(op==='nonempty')idx=idx.filter(i=>!dmBlank(t.rows[i][col.key]));
  else if(op==='dup'){const m=new Map();t.rows.forEach(r=>{if(!dmBlank(r[col.key])){const k=dmNorm(r[col.key]).trim();m.set(k,(m.get(k)||0)+1)}});idx=idx.filter(i=>{const v=t.rows[i][col.key];return !dmBlank(v)&&m.get(dmNorm(v).trim())>1})}
  else if(nv!==''){
   idx=idx.filter(i=>{const v=t.rows[i][col.key],s=dmNorm(v).trim();
    if(op==='contains')return s.includes(nv);
    if(op==='eq')return s===nv;
    const a=Number(v),b=Number(val);
    const c=(isFinite(a)&&isFinite(b)&&!dmBlank(v))?a-b:String(v).localeCompare(String(val),'ja',{numeric:true});
    if(dmBlank(v))return false;
    return op==='ge'?c>=0:c<=0})}}
 return idx}
function dmView(t){
 let idx=dmFiltered(t);
 const sc=t.columns.find(c=>c.key===dm.sortKey);
 if(sc){const f=dmCmp(sc,dm.sortDir);idx=idx.map(i=>[i,t.rows[i]]).sort((a,b)=>f(a[1],b[1])||a[0]-b[0]).map(x=>x[0])}
 return idx}

/* ---- データ点検 ---- */
function dmAnalyze(t){
 const r={blank:[],trim:[],zen:[],nonnum:[],blankCells:{},total:t.rows.length};
 const dataCols=t.columns.filter(c=>c.key!=='id');
 t.rows.forEach((row,i)=>{
  if(!dataCols.some(c=>!dmBlank(row[c.key])))r.blank.push(i);
  t.columns.forEach(c=>{
   const v=row[c.key],s=String(v??'');
   if(s.trim()==='')r.blankCells[c.key]=(r.blankCells[c.key]||0)+1;
   if(typeof v==='string'&&v!==v.trim()&&s.trim()!=='')r.trim.push([i,c]);
   if(/[！-～　]/.test(s))r.zen.push([i,c]);
   if(c.type==='number'&&s.trim()!==''&&!isFinite(Number(s)))r.nonnum.push([i,c])})});
 return r}
function dmDupGroups(t,cols){
 const m=new Map();
 t.rows.forEach((row,i)=>{if(cols.some(c=>dmBlank(row[c.key])))return;const k=JSON.stringify(cols.map(c=>dmNorm(row[c.key]).trim()));(m.get(k)||m.set(k,[]).get(k)).push(i)});
 return [...m.values()].filter(g=>g.length>1)}

 if(!dm.dupCols||dm.dupCols.some(k=>!t.columns.some(c=>c.key===k)))dm.dupCols=t.columns.filter(c=>c.key!=='id').map(c=>c.key);
 const cols=t.columns.filter(c=>dm.dupCols.includes(c.key)),groups=cols.length?dmDupGroups(t,cols):[],extra=groups.reduce((s,g)=>s+g.length-1,0);
 const item=(n,title,desc,fix,label)=>`<div class="dm-chk ${n?'bad':'good'}"><span><b>${n?'⚠':'✓'} ${esc(title)}：${n?`<span class="dm-ng">${n}件</span>`:'<span class="dm-ok">問題なし</span>'}</b><small>${esc(desc)}</small></span>${n&&fix?`<button class="btn small" data-dm-fix="${fix}">${esc(label)}</button>`:''}</div>`;
 const emptyCols=t.columns.filter(c=>a.blankCells[c.key]).map(c=>`${c.label}（${a.blankCells[c.key]}）`);
 const issues=[].concat(a.trim.map(x=>['前後の空白',x]),a.zen.map(x=>['全角文字',x]),a.nonnum.map(x=>['数値でない',x])).slice(0,30);
 return `<p class="helper">「${esc(t.name)}」${a.total}行を点検しました。直した結果は Ctrl+Z（取り消し）やごみ箱で戻せます。</p>`
 +item(a.blank.length,'完全に空の行','ID以外がすべて空欄の行です。','blank','空の行を削除')
 +item(a.trim.length,'前後に空白があるセル','見た目では分からない空白で、検索や照合が合わなくなる原因です。','trim','空白を取り除く')
 +item(a.zen.length,'全角の英数字・記号を含むセル','「ＡＢＣ１２３」のような全角は、「ABC123」と別物として扱われます。','zen','半角にそろえる')
 +item(a.nonnum.length,'数値列なのに数値でない値','集計・グラフ・計算で無視されたり、エラーの原因になります。','nonnum','空欄にする')
 +`<div class="dm-chk ${extra?'bad':'good'}"><span><b>${extra?'⚠':'✓'} 重複している行：${extra?`<span class="dm-ng">${extra}行（${groups.length}組）</span>`:'<span class="dm-ok">なし</span>'}</b><small>下で選んだ列の値がすべて同じ行を「重複」とみなします。先頭の1行を残し、あとを削除します。</small><div class="dm-cols">${t.columns.map(c=>`<label><input type="checkbox" data-dm-dupcol="${attr(c.key)}" ${dm.dupCols.includes(c.key)?'checked':''}>${esc(c.label)}</label>`).join('')}</div></span>${extra?'<button class="btn small" data-dm-fix="dup">重複行を削除（先頭を残す）</button>':''}</div>`
 +(emptyCols.length?`<div class="dm-chk"><span><b>空欄のあるセル</b><small>${esc(emptyCols.join('、'))}　※「一括置換」で空欄をまとめて埋められます。</small></span></div>`:'')
 +(issues.length?`<b>問題のあるセル（先頭${issues.length}件）</b><div class="dm-mini"><table><thead><tr><th>種類</th><th>行</th><th>列</th><th>値</th></tr></thead><tbody>${issues.map(([k,[i,c]])=>`<tr><td>${k}</td><td>${i+1}</td><td>${esc(c.label)}</td><td>${esc(String(t.rows[i][c.key]).slice(0,40))}</td></tr>`).join('')}</tbody></table></div>`:'')}
function dmCheck(id){

   case 'zen':for(const [i,c] of a.zen)text(i,c,s=>s.replace(/　/g,' ').replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)));msg=a.zen.length+'セルを半角にそろえました';break;
   case 'nonnum':for(const [i,c] of a.nonnum)t.rows[i][c.key]='';msg=a.nonnum.length+'セルを空欄にしました';break;
   case 'dup':{const cols=t.columns.filter(c=>dm.dupCols.includes(c.key)),del=dmDupGroups(t,cols).flatMap(g=>g.slice(1)).sort((x,y)=>y-x);for(const i of del)t.rows.splice(i,1);msg=del.length+'行の重複を削除しました';break}}
  dm.sel.clear();persist();render();message(msg+'（取り消しは Ctrl+Z）');dmCheck(id)});

/* ---- 一括置換 ---- */
function dmReplaceVal(s,o){
 const str=String(s??'');
 if(o.exact){const a=o.ci?str.toLowerCase():str,b=o.ci?o.find.toLowerCase():o.find;return a===b?o.repl:null}
 if(!o.find)return null;
 const re=new RegExp(o.find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),o.ci?'gi':'g');
 return str.search(new RegExp(re.source,o.ci?'i':''))>=0?str.replace(re,()=>o.repl):null}
function dmReplacePlan(t,o){
 const cols=o.col?t.columns.filter(c=>c.key===o.col):t.columns,hits=[];let skipped=0;
 t.rows.forEach((row,i)=>cols.forEach(c=>{
  const n=dmReplaceVal(row[c.key],o);if(n===null)return;
  let val=n;
  if(c.type==='number'){if(n==='')val='';else if(isFinite(Number(n)))val=Number(n);else{skipped++;return}}
  if(String(val)!==String(row[c.key]??''))hits.push([i,c,val])}));
 return {hits,skipped}}
function dmReplace(id){
 const t=findTable(id);if(!t)return;
 const read=d=>({col:d.querySelector('[data-dm-r="col"]').value,find:d.querySelector('[data-dm-r="find"]').value,repl:d.querySelector('[data-dm-r="repl"]').value,exact:d.querySelector('[data-dm-r="mode"]').value==='exact',ci:d.querySelector('[data-dm-r="ci"]').checked});
 v10Modal('一括置換：'+t.name,`<div class="dm-form"><label class="field wide"><span>対象の列</span><select class="form-control" data-dm-r="col"><option value="">すべての列</option>${t.columns.map(c=>`<option value="${attr(c.key)}">${esc(c.label)}</option>`).join('')}</select></label><label class="field"><span>探す文字</span><input class="form-control" data-dm-r="find" placeholder="例：(株)"></label><label class="field"><span>置き換える文字</span><input class="form-control" data-dm-r="repl" placeholder="例：株式会社"></label><label class="field"><span>一致のしかた</span><select class="form-control" data-dm-r="mode"><option value="part">文字の一部が一致</option><option value="exact">セル全体が一致（空欄を探すなら、探す文字を空に）</option></select></label><label class="field"><span>&nbsp;</span><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-dm-r="ci">英字の大文字・小文字を区別しない</label></label></div><div class="dm-preview" data-dm-r-preview>探す文字を入力すると、置換される件数が表示されます。</div><div class="dm-mini" data-dm-r-list hidden></div>`,d=>{
  const o=read(d);if(!o.exact&&!o.find)throw Error('探す文字を入力してください');
  const {hits}=dmReplacePlan(t,o);if(!hits.length)throw Error('置換対象がありません');
  for(const [i,c,v] of hits)t.rows[i][c.key]=v;
  dm.sel.clear();persist();render();message(hits.length+'セルを置換しました（取り消しは Ctrl+Z）')});
 const d=document.getElementById('v10-modal'),upd=()=>{
  const o=read(d),pv=d.querySelector('[data-dm-r-preview]'),ls=d.querySelector('[data-dm-r-list]');
  if(!o.exact&&!o.find){pv.textContent='探す文字を入力すると、置換される件数が表示されます。';ls.hidden=true;return}
  const {hits,skipped}=dmReplacePlan(t,o),rows=new Set(hits.map(h=>h[0])).size;
  pv.innerHTML=`<b>${hits.length}セル（${rows}行）</b>が置き換わります。`+(skipped?`<br>※ 数値列に数値以外を入れられないセルが ${skipped} 件あり、スキップします。`:'');
  ls.hidden=!hits.length;
  ls.innerHTML=hits.length?`<table><thead><tr><th>行</th><th>列</th><th>変更前</th><th>変更後</th></tr></thead><tbody>${hits.slice(0,12).map(([i,c,v])=>`<tr><td>${i+1}</td><td>${esc(c.label)}</td><td>${esc(String(t.rows[i][c.key]??'').slice(0,30))}</td><td>${esc(String(v).slice(0,30))}</td></tr>`).join('')}</tbody></table>`:''};
 d.addEventListener('input',upd);d.addEventListener('change',upd);
}

/* ---- 列の統計 ---- */
function dmStats(id){
 const t=findTable(id);if(!t)return;
 const fmt=n=>Number.isInteger(n)?n.toLocaleString():Number(n.toFixed(4)).toLocaleString();
 const rows=t.columns.map(c=>{
  const vals=t.rows.map(r=>r[c.key]).filter(v=>!dmBlank(v)),freq=new Map();
  for(const v of vals)freq.set(String(v),(freq.get(String(v))||0)+1);
  const top=[...freq.entries()].sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>1).slice(0,3).map(([v,n])=>`${v.slice(0,14)}(${n})`).join('、')||'—';
  let mn='—',mx='—',sum='—',avg='—';
  if(c.type==='number'){const ns=vals.map(Number).filter(isFinite);if(ns.length){mn=fmt(Math.min(...ns));mx=fmt(Math.max(...ns));const s=ns.reduce((p,q)=>p+q,0);sum=fmt(s);avg=fmt(s/ns.length)}}
  else if(vals.length){const sorted=vals.map(String).sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));mn=sorted[0].slice(0,14);mx=sorted[sorted.length-1].slice(0,14)}
  const blank=t.rows.length-vals.length;
  return `<tr><td><b>${esc(c.label)}</b></td><td>${{text:'文字',number:'数値',date:'日付'}[c.type]||c.type}</td><td class="num">${vals.length}</td><td class="num">${blank}${t.rows.length?`（${Math.round(blank/t.rows.length*100)}%）`:''}</td><td class="num">${freq.size}</td><td class="num">${esc(mn)}</td><td class="num">${esc(mx)}</td><td class="num">${esc(sum)}</td><td class="num">${esc(avg)}</td><td>${esc(top)}</td></tr>`}).join('');
 v10Modal('列の統計：'+t.name,`<p class="helper">${t.rows.length}行・${t.columns.length}列。「種類」は重複を除いた値の数、「多い値」は2回以上出てくる値の上位3つです。文字・日付の列の最小／最大は並び順での先頭／末尾です。</p><div style="overflow:auto"><table class="dm-table"><thead><tr><th>列</th><th>型</th><th>入力あり</th><th>空欄</th><th>種類</th><th>最小</th><th>最大</th><th>合計</th><th>平均</th><th>多い値</th></tr></thead><tbody>${rows}</tbody></table></div>`);
 document.querySelector('#v10-modal section')?.style.setProperty('max-width','980px')}

/* ---- 貼り付け取り込み ---- */
function dmParseText(text){
 const first=(text.split(/\r?\n/).find(l=>l.trim())||''),delim=first.includes('\t')?'\t':',';
 const out=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
  else if(ch==='"'&&cell==='')q=true;
  else if(ch===delim){row.push(cell);cell=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell=''}
  else cell+=ch}
 if(cell!==''||row.length){row.push(cell);out.push(row)}
 return out.filter(r=>r.some(v=>String(v).trim()!==''))}
function dmPastePlan(t,text,header){
 const grid=dmParseText(text);if(!grid.length)return {rows:[],matched:0,bad:0,body:0};
 let map=t.columns.map((_,i)=>i),matched=0,body=grid;
 if(header){
  const hs=grid[0].map(h=>dmNorm(h).trim());
  const byLabel=t.columns.map(c=>{const k=hs.indexOf(dmNorm(c.label).trim());return k>=0?k:hs.indexOf(dmNorm(c.key).trim())});
  matched=byLabel.filter(k=>k>=0).length;
  if(matched)map=byLabel;
  body=grid.slice(1)}
 let bad=0;
 const rows=body.map(r=>{const row={};t.columns.forEach((c,ci)=>{const k=map[ci],raw=k>=0&&k!==undefined?String(r[k]??'').trim():'';let v=raw;
  if(c.type==='number'&&raw!==''){const n=Number(raw.replace(/,/g,''));if(isFinite(n))v=n;else{v='';bad++}}
  if(c.key==='id'&&raw==='')v=uid('row');
  row[c.key]=v});return row});
 return {rows,matched,bad,body:body.length}}

 const W=170,H=62,minX=Math.min(...nodes.map(n=>Number(n.x)||0)),minY=Math.min(...nodes.map(n=>Number(n.y)||0));
 const pos=new Map(nodes.map(n=>[n.id,{x:(Number(n.x)||0)-minX+20,y:(Number(n.y)||0)-minY+24}]));
 const w=Math.max(...[...pos.values()].map(p=>p.x))+W+30,h=Math.max(...[...pos.values()].map(p=>p.y))+H+40;
 let lines='',labels='';
 const link=(a,b,label,color)=>{const p=pos.get(a.id),q=pos.get(b);if(!p||!q)return;const x1=p.x+W,y1=p.y+H/2,x2=q.x,y2=q.y+H/2,mx=(x1+x2)/2;
  lines+=`<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2-6} ${y2}" fill="none" stroke="${color}" stroke-width="2"/><path d="M${x2} ${y2} l-8 -4 v8 z" fill="${color}"/>`;
  if(label)labels+=`<span class="tp-lbl" style="left:${x1+6}px;top:${y1-(y2<y1?20:-4)}px;color:${color}">${label}</span>`};
 const byId=new Map(nodes.map(n=>[n.id,n]));
 for(const n of nodes){if(n.type==='condition'){if(n.yes)link(n,n.yes,'YES','#16a579');if(n.no)link(n,n.no,'NO','#d65b3d')}else if(n.next)link(n,n.next,'','#7089b8')}
 const boxes=nodes.map(n=>{const p=pos.get(n.id);let title,sub='';
  if(n.type==='start'){title='開始'}
  else if(n.type==='condition'){title='条件分岐';sub=`${TP_COND[n.operator]||'条件未設定'}${n.operator&&n.operator!=='notempty'?'：'+String(n.value??''):''}`}
  else{title='処理';sub=(TP_OPS[n.operation]||n.operation||'未設定')+(n.message?'：'+n.message:n.type==='action'&&n.operation==='setvalue'?'：'+String(n.value??''):'')}
  return `<div class="tp-node ${attr(n.type)}" style="left:${p.x}px;top:${p.y}px;min-height:${H}px"><b>${esc(title)}</b><small>${esc(sub.slice(0,60))}</small></div>`}).join('');
 return `<p class="tp-pv-note">ノード ${nodes.length}個（緑＝開始／青＝処理／黄＝条件分岐）</p><div class="tp-fl"><div class="tp-fl-in" style="width:${w}px;height:${h}px"><svg width="${w}" height="${h}">${lines}</svg>${labels}${boxes}</div></div>`}
function tpPvTable(t){
 const rows=(t.rows||[]).slice(0,8);
 return `<p class="tp-pv-note">${t.columns.length}列${t.rows?.length?`・サンプル${t.rows.length}行（先頭${rows.length}行を表示）`:'・サンプルデータなし'}${t.conditionalFormats?.length?`・色分けルール${t.conditionalFormats.length}件`:''}</p><div style="overflow:auto"><table class="tp-t"><thead><tr>${t.columns.map(c=>`<th>${esc(c.label)}<small>${{text:'文字',number:'数値',date:'日付'}[c.type]||c.type}</small></th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${t.columns.map(c=>`<td>${esc(String(r[c.key]??'').slice(0,24))}</td>`).join('')}</tr>`).join(''):`<tr>${t.columns.map(()=>'<td>&nbsp;</td>').join('')}</tr>`}</tbody></table></div>`}
function tpPvComponents(components,layoutMode,note){
 const free=layoutMode==='free';
 const page={id:'tp-pv',name:'preview',components:clone(components),layoutMode:free?'free':''};
 let html='';try{html=buildPage(page,false)}catch(e){return '<p class="tp-pv-note">プレビューを表示できませんでした：'+esc(e.message)+'</p>'}
 const box=document.createElement('div');box.innerHTML=html;box.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));box.querySelectorAll('.drop-finish,.resize-handle,[data-resize]').forEach(x=>x.remove());box.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));box.querySelectorAll('[draggable]').forEach(x=>x.removeAttribute('draggable'));
 const inner=box.innerHTML;
 const width=free?960:900,height=free?650:0,scale=0.62;
 const frame=free?`<div class="tp-pv-frame" style="width:${width*scale}px;height:${height*scale}px"><div class="tp-pv-scale" style="width:${width}px;height:${height}px;transform:scale(${scale})">${inner}</div></div>`
  :`<div class="tp-pv-frame" style="padding:14px"><div class="tp-pv-scale" style="zoom:0.8"><div class="canvas" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:0;min-height:0;height:auto;background:none;border:0;box-shadow:none">${inner}</div></div></div>`;
 return `<p class="tp-pv-note">${note||''}部品${components.length}個（クリックなどの操作はできません）</p>${frame}`}
function tpPvHTML(kind,t){
 if(kind==='table')return tpPvTable(t);
 if(kind==='flow')return tpPvFlow(t);
 if(kind==='set')return tpPvComponents(t.components,'','');
 return tpPvComponents(t.components,t.layoutMode,'')}
function tpPvBox(kind,t){return `<div class="tp-pv" data-tp-pvbox><div class="tp-pv-head"><span>プレビュー：${esc(t.name)}</span><button class="btn small" data-tp-pvclose>閉じる ✕</button></div><div class="tp-pv-body">${tpPvHTML(kind,t)}</div></div>`}

function tpPvQuery(q){const steps=q.query?.steps||[];return `<p class="tp-pv-note">加工手順 ${steps.length}ステップ（上から順に実行）</p><ol style="margin:0;padding-left:22px;line-height:1.9;font-size:13px">${steps.map(st=>`<li>${esc(QUERY_TYPES[st.type]||st.type)}${st.enabled===false?'（無効）':''}</li>`).join('')||'<li>ステップなし</li>'}</ol>`}
function tpPvBoxHTML(name,inner){return `<div class="tp-pv"><div class="tp-pv-head"><span>プレビュー：${esc(name)}</span><button class="btn small" data-tp-pvclose>閉じる ✕</button></div><div class="tp-pv-body">${inner}</div></div>`}

loadFormatRules();

render();
})();
</script>
</body>
</html>
